<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1326"/>
      <stop offset="1" stop-color="#172138"/>
    </linearGradient>
    <linearGradient id="redbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4D"/>
      <stop offset="1" stop-color="#EB1000"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#redbar)"/>

  <!-- eyebrow -->
  <text x="70" y="86" fill="#FF5A4D" font-size="22" font-weight="700" letter-spacing="3">MODEL CONTEXT PROTOCOL  ·  HANDS-ON</text>

  <!-- title -->
  <text x="68" y="184" fill="#F5F8FF" font-size="62" font-weight="800">Exploring Adobe Target</text>
  <text x="68" y="260" font-size="62" font-weight="800">
    <tspan fill="#F5F8FF">with an </tspan><tspan fill="#FF5A4D">AI-Powered</tspan><tspan fill="#F5F8FF"> MCP Client</tspan>
  </text>

  <!-- flow diagram: AI Agent -> MCP Server -> Adobe Target -->
  <g>
    <!-- node 1 -->
    <rect x="70" y="345" width="270" height="96" rx="16" fill="#1E2A45" stroke="#34406A" stroke-width="2"/>
    <text x="205" y="388" text-anchor="middle" fill="#F5F8FF" font-size="28" font-weight="700">AI Agent</text>
    <text x="205" y="418" text-anchor="middle" fill="#9DB2D0" font-size="17">Claude · Cursor · ChatGPT</text>

    <!-- arrow 1 -->
    <line x1="348" y1="393" x2="412" y2="393" stroke="#6B7BA5" stroke-width="3"/>
    <polygon points="420,393 406,386 406,400" fill="#6B7BA5"/>

    <!-- node 2 -->
    <rect x="430" y="345" width="270" height="96" rx="16" fill="#1E2A45" stroke="#34406A" stroke-width="2"/>
    <text x="565" y="388" text-anchor="middle" fill="#F5F8FF" font-size="28" font-weight="700">MCP Server</text>
    <text x="565" y="418" text-anchor="middle" fill="#9DB2D0" font-size="17">tools/list · OAuth 2.0</text>

    <!-- arrow 2 -->
    <line x1="708" y1="393" x2="772" y2="393" stroke="#6B7BA5" stroke-width="3"/>
    <polygon points="780,393 766,386 766,400" fill="#6B7BA5"/>

    <!-- node 3 (Adobe Target, red accent) -->
    <rect x="790" y="345" width="270" height="96" rx="16" fill="#EB1000"/>
    <text x="925" y="388" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800">Adobe Target</text>
    <text x="925" y="418" text-anchor="middle" fill="#FFD9D4" font-size="17">activities · reports</text>
  </g>

  <!-- chips -->
  <g font-size="22" font-weight="600">
    <rect x="70" y="500" width="236" height="48" rx="24" fill="#16203A" stroke="#2C3960" stroke-width="1.5"/>
    <text x="188" y="531" text-anchor="middle" fill="#C7D3EA">23 read-only tools</text>

    <rect x="324" y="500" width="216" height="48" rx="24" fill="#16203A" stroke="#2C3960" stroke-width="1.5"/>
    <text x="432" y="531" text-anchor="middle" fill="#C7D3EA">OAuth 2.0 login</text>

    <rect x="558" y="500" width="168" height="48" rx="24" fill="#16203A" stroke="#2C3960" stroke-width="1.5"/>
    <text x="642" y="531" text-anchor="middle" fill="#C7D3EA">Public Beta</text>
  </g>

  <!-- footer -->
  <text x="70" y="598" fill="#6B7BA5" font-size="20">modelcontextprotocol.io  ·  targetmcp.adobe.io</text>
</svg>
